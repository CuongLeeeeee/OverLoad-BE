name: CI - Build & Test

# Runs on pull requests into main and on pushes to main and feature/refactor branches.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "refactor/**"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Integration tests run against a real PostgreSQL (see tests/.../ApiFactory.cs);
    # service tests keep using EF Core InMemory.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore OverLoad.sln

      - name: Build solution
        run: dotnet build OverLoad.sln --no-restore --configuration Release

      - name: Run tests
        env:
          TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=ci-password
        run: dotnet test OverLoad.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build only (no push) so a broken Dockerfile fails the PR instead of the deploy.
      - name: Build image
        run: docker build -t overload-api:ci .
