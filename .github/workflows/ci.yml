name: CI - Build & Test

# Runs on every pull request into main and on every push to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore OverLoad.sln

      - name: Build solution
        run: dotnet build OverLoad.sln --no-restore --configuration Release

      # Tests use EF Core InMemory, so no database service is needed.
      - name: Run tests
        run: dotnet test OverLoad.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build only (no push) so a broken Dockerfile fails the PR instead of the deploy.
      - name: Build image
        run: docker build -t overload-api:ci .
