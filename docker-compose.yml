# Local development stack: the API plus its own PostgreSQL.
#   cp .env.example .env   (then fill in the values)
#   docker compose up --build
# API: http://localhost:8080 (Swagger at the root), PostgreSQL: localhost:5432
services:
  db:
    image: postgres:16-alpine
    container_name: overload-db
    environment:
      POSTGRES_DB: overload
      POSTGRES_USER: overload
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - overload-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overload -d overload"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: overload-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development          # enables Swagger and migrate-on-startup
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=overload;Username=overload;Password=${DB_PASSWORD}"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      PayOS__ClientId: ${PAYOS_CLIENT_ID:-}
      PayOS__ApiKey: ${PAYOS_API_KEY:-}
      PayOS__ChecksumKey: ${PAYOS_CHECKSUM_KEY:-}
      Payment__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:3000}
      Cors__AllowedOrigins__0: ${FRONTEND_BASE_URL:-http://localhost:3000}

volumes:
  overload-db-data:
